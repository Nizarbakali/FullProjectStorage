<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470"
     font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"
           aria-label="Nuage de points des totaux annuels de 2021 à 2024 : 1000, 1150, 1180 et 1400. Une droite de régression de pente 123 par an traverse le nuage ; les écarts verticaux entre chaque point et la droite valent respectivement plus 2, plus 29, moins 64 et plus 33. La droite est prolongée jusqu'en 2025, et la prévision retenue est 1523.">
        <rect x="0" y="0" width="860" height="470" fill="#FFFFFF"/>

        <!-- ── Légende ── -->
        <circle cx="96" cy="28" r="6" fill="#2a78d6"/>
        <text x="110" y="33" font-size="12.5" fill="#4A555F">Totaux annuels observés</text>
        <line x1="290" y1="28" x2="322" y2="28" stroke="#2a78d6" stroke-width="2.5"/>
        <text x="332" y="33" font-size="12.5" fill="#4A555F">Droite de régression</text>
        <circle cx="500" cy="28" r="6" fill="#eb6834"/>
        <text x="514" y="33" font-size="12.5" fill="#4A555F">Prévision 2025</text>
        <line x1="640" y1="28" x2="672" y2="28" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="682" y="33" font-size="12.5" fill="#4A555F">Écart (résidu)</text>

        <!-- ── Grille ── -->
        <line x1="90" y1="400" x2="700" y2="400" stroke="#E4E8EB" stroke-width="1"/>
        <line x1="90" y1="351.4" x2="700" y2="351.4" stroke="#E4E8EB" stroke-width="1"/>
        <line x1="90" y1="302.9" x2="700" y2="302.9" stroke="#E4E8EB" stroke-width="1"/>
        <line x1="90" y1="254.3" x2="700" y2="254.3" stroke="#E4E8EB" stroke-width="1"/>
        <line x1="90" y1="205.7" x2="700" y2="205.7" stroke="#E4E8EB" stroke-width="1"/>
        <line x1="90" y1="157.1" x2="700" y2="157.1" stroke="#E4E8EB" stroke-width="1"/>
        <line x1="90" y1="108.6" x2="700" y2="108.6" stroke="#E4E8EB" stroke-width="1"/>
        <line x1="90" y1="60" x2="700" y2="60" stroke="#E4E8EB" stroke-width="1"/>

        <!-- ── Axes ── -->
        <line x1="90" y1="60" x2="90" y2="400" stroke="#BFC7CE" stroke-width="1.4"/>
        <line x1="90" y1="400" x2="700" y2="400" stroke="#BFC7CE" stroke-width="1.4"/>

        <text x="78" y="405" text-anchor="end" font-size="11.5" fill="#75818B">900</text>
        <text x="78" y="356" text-anchor="end" font-size="11.5" fill="#75818B">1 000</text>
        <text x="78" y="307" text-anchor="end" font-size="11.5" fill="#75818B">1 100</text>
        <text x="78" y="259" text-anchor="end" font-size="11.5" fill="#75818B">1 200</text>
        <text x="78" y="210" text-anchor="end" font-size="11.5" fill="#75818B">1 300</text>
        <text x="78" y="162" text-anchor="end" font-size="11.5" fill="#75818B">1 400</text>
        <text x="78" y="113" text-anchor="end" font-size="11.5" fill="#75818B">1 500</text>
        <text x="78" y="65" text-anchor="end" font-size="11.5" fill="#75818B">1 600</text>
        <text x="26" y="230" text-anchor="middle" font-size="12" fill="#75818B" transform="rotate(-90 26 230)">Total annuel</text>

        <text x="90"  y="422" text-anchor="middle" font-size="12.5" fill="#4A555F">2021</text>
        <text x="243" y="422" text-anchor="middle" font-size="12.5" fill="#4A555F">2022</text>
        <text x="395" y="422" text-anchor="middle" font-size="12.5" fill="#4A555F">2023</text>
        <text x="548" y="422" text-anchor="middle" font-size="12.5" fill="#4A555F">2024</text>
        <text x="700" y="422" text-anchor="middle" font-size="12.5" fill="#eb6834" font-weight="600">2025</text>

        <!-- ── Écarts (résidus) ── -->
        <line x1="90"  y1="351.4" x2="90"  y2="352.4" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="243" y1="278.6" x2="243" y2="292.7" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="395" y1="264.0" x2="395" y2="232.9" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="548" y1="157.1" x2="548" y2="173.2" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="406" y="252" font-size="11.5" fill="#75818B">écart : −64</text>

        <!-- ── Droite de régression ── -->
        <line x1="90" y1="352.4" x2="548" y2="173.2" stroke="#2a78d6" stroke-width="2.5"/>
        <line x1="548" y1="173.2" x2="700" y2="113.4" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/>

        <!-- ── Annotation de pente ── -->
        <rect x="104" y="78" width="196" height="52" rx="7" fill="#F3F8FD" stroke="#2a78d6" stroke-width="1.2"/>
        <text x="118" y="100" font-size="12.5" fill="#4A555F">Pente de la droite</text>
        <text x="118" y="120" font-size="14" font-weight="700" fill="#2a78d6">a = +123 par an</text>
        <line x1="252" y1="132" x2="298" y2="266" stroke="#2a78d6" stroke-width="1.2"/>
        <circle cx="299" cy="270" r="3" fill="#2a78d6"/>

        <!-- ── Points observés ── -->
        <circle cx="90"  cy="351.4" r="7" fill="#2a78d6" stroke="#FFFFFF" stroke-width="2"><title>2021 — total 1 000</title></circle>
        <circle cx="243" cy="278.6" r="7" fill="#2a78d6" stroke="#FFFFFF" stroke-width="2"><title>2022 — total 1 150</title></circle>
        <circle cx="395" cy="264.0" r="7" fill="#2a78d6" stroke="#FFFFFF" stroke-width="2"><title>2023 — total 1 180</title></circle>
        <circle cx="548" cy="157.1" r="7" fill="#2a78d6" stroke="#FFFFFF" stroke-width="2"><title>2024 — total 1 400</title></circle>

        <text x="90"  y="337" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2127">1 000</text>
        <text x="243" y="264" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2127">1 150</text>
        <text x="395" y="285" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2127">1 180</text>
        <text x="548" y="142" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2127">1 400</text>

        <!-- ── Prévision ── -->
        <circle cx="700" cy="113.4" r="5.5" fill="#FFFFFF" stroke="#2a78d6" stroke-width="2"><title>Valeur de la droite en 2025 — 1 490</title></circle>
        <circle cx="700" cy="97.4" r="8" fill="#eb6834" stroke="#FFFFFF" stroke-width="2"><title>Prévision retenue pour 2025 — 1 523</title></circle>
        <text x="714" y="88" font-size="12.5" font-weight="700" fill="#eb6834">Prévision 2025</text>
        <text x="714" y="105" font-size="13" font-weight="700" fill="#eb6834">1 523</text>
        <text x="714" y="130" font-size="11.5" fill="#75818B">droite : 1 490</text>
      </svg>
