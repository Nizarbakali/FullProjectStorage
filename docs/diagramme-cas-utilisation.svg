<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 900" width="1020" height="900"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Diagramme de cas d'utilisation — Application de gestion de stock GMD Metal</title>
  <desc>L'Utilisateur et l'Administrateur peuvent tous deux s'inscrire et se connecter. L'Utilisateur consulte la heatmap, les graphiques, la carte et prevoit la demande. L'Administrateur herite de l'Utilisateur et gere en plus l'import CSV, la structure de l'entrepot, les articles et les seuils, et les utilisateurs.</desc>

  <defs>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#C25D07" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="900" fill="#FFFFFF"/>

  <!-- Frontiere du systeme -->
  <rect x="290" y="40" width="690" height="820" rx="14" fill="none" stroke="#BFC7CE" stroke-width="1.5"/>
  <text x="635" y="76" text-anchor="middle" font-size="13" letter-spacing="1.3" fill="#75818B">APPLICATION DE GESTION DE STOCK</text>

  <!-- Cas de l'Utilisateur -->
  <ellipse cx="530" cy="125" rx="150" ry="29" fill="#F7F9FA" stroke="#2C6E8F" stroke-width="1.4"/>
  <text x="530" y="130" text-anchor="middle" font-size="13" fill="#1B2127">Consulter la heatmap d'occupation</text>
  <ellipse cx="530" cy="193" rx="150" ry="29" fill="#F7F9FA" stroke="#2C6E8F" stroke-width="1.4"/>
  <text x="530" y="198" text-anchor="middle" font-size="13" fill="#1B2127">Consulter les graphiques de stock</text>
  <ellipse cx="530" cy="261" rx="150" ry="29" fill="#F7F9FA" stroke="#2C6E8F" stroke-width="1.4"/>
  <text x="530" y="266" text-anchor="middle" font-size="13" fill="#1B2127">Consulter la carte des magasins</text>
  <ellipse cx="530" cy="329" rx="150" ry="29" fill="#F7F9FA" stroke="#2C6E8F" stroke-width="1.4"/>
  <text x="530" y="334" text-anchor="middle" font-size="13" fill="#1B2127">Prévoir la demande d'un article</text>

  <!-- Cas partages -->
  <ellipse cx="530" cy="425" rx="150" ry="29" fill="#EDF3F6" stroke="#2C6E8F" stroke-width="1.4"/>
  <text x="530" y="430" text-anchor="middle" font-size="13" fill="#1B2127">S'inscrire</text>
  <ellipse cx="530" cy="493" rx="150" ry="29" fill="#EDF3F6" stroke="#2C6E8F" stroke-width="1.4"/>
  <text x="530" y="498" text-anchor="middle" font-size="13" fill="#1B2127">Se connecter</text>

  <!-- Cas de l'Administrateur -->
  <ellipse cx="530" cy="589" rx="150" ry="29" fill="#FBEBD6" stroke="#C25D07" stroke-width="1.4"/>
  <text x="530" y="594" text-anchor="middle" font-size="13" fill="#1B2127">Importer un fichier CSV</text>
  <ellipse cx="530" cy="657" rx="150" ry="29" fill="#FBEBD6" stroke="#C25D07" stroke-width="1.4"/>
  <text x="530" y="662" text-anchor="middle" font-size="13" fill="#1B2127">Gérer la structure de l'entrepôt</text>
  <ellipse cx="530" cy="725" rx="150" ry="29" fill="#FBEBD6" stroke="#C25D07" stroke-width="1.4"/>
  <text x="530" y="730" text-anchor="middle" font-size="13" fill="#1B2127">Gérer les articles et les seuils</text>
  <ellipse cx="530" cy="793" rx="150" ry="29" fill="#FBEBD6" stroke="#C25D07" stroke-width="1.4"/>
  <text x="530" y="798" text-anchor="middle" font-size="13" fill="#1B2127">Gérer les utilisateurs</text>

  <!-- Cas satellites -->
  <ellipse cx="855" cy="530" rx="108" ry="30" fill="#F7F9FA" stroke="#BFC7CE" stroke-width="1.4"/>
  <text x="855" y="525" text-anchor="middle" font-size="13" fill="#1B2127">Aperçu avant import</text>
  <text x="855" y="542" text-anchor="middle" font-size="13" fill="#1B2127">(dry-run)</text>
  <ellipse cx="855" cy="640" rx="108" ry="30" fill="#F7F9FA" stroke="#BFC7CE" stroke-width="1.4"/>
  <text x="855" y="635" text-anchor="middle" font-size="13" fill="#1B2127">Nettoyer et valider</text>
  <text x="855" y="652" text-anchor="middle" font-size="13" fill="#1B2127">les données</text>

  <!-- Acteur : Utilisateur -->
  <circle cx="165" cy="195" r="13" fill="none" stroke="#1B2127" stroke-width="1.8"/>
  <line x1="165" y1="208" x2="165" y2="238" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="146" y1="219" x2="184" y2="219" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="165" y1="238" x2="150" y2="263" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="165" y1="238" x2="180" y2="263" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <text x="165" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2127">Utilisateur</text>

  <!-- Acteur : Administrateur -->
  <circle cx="165" cy="595" r="13" fill="none" stroke="#1B2127" stroke-width="1.8"/>
  <line x1="165" y1="608" x2="165" y2="638" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="146" y1="619" x2="184" y2="619" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="165" y1="638" x2="150" y2="663" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="165" y1="638" x2="180" y2="663" stroke="#1B2127" stroke-width="1.8" stroke-linecap="round"/>
  <text x="165" y="683" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2127">Administrateur</text>

  <!-- Generalisation -->
  <line x1="165" y1="580" x2="165" y2="310" stroke="#75818B" stroke-width="1.5"/>
  <polygon points="165,298 158,312 172,312" fill="#FFFFFF" stroke="#75818B" stroke-width="1.5"/>
  <text x="176" y="440" text-anchor="start" font-size="11.5" font-style="italic" fill="#75818B">hérite de</text>

  <!-- Associations : Utilisateur -->
  <line x1="187" y1="225" x2="380" y2="125" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="225" x2="380" y2="193" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="225" x2="380" y2="261" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="225" x2="380" y2="329" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="225" x2="380" y2="425" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="225" x2="380" y2="493" stroke="#8A949C" stroke-width="1.3"/>

  <!-- Associations : Administrateur -->
  <line x1="187" y1="620" x2="380" y2="425" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="620" x2="380" y2="493" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="620" x2="380" y2="589" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="620" x2="380" y2="657" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="620" x2="380" y2="725" stroke="#8A949C" stroke-width="1.3"/>
  <line x1="187" y1="620" x2="380" y2="793" stroke="#8A949C" stroke-width="1.3"/>

  <!-- extend -->
  <line x1="747" y1="542" x2="676" y2="572" stroke="#C25D07" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#dep-arrow)"/>
  <text x="708" y="536" text-anchor="middle" font-size="11" font-style="italic" fill="#8A4204">«extend»</text>
  <!-- include -->
  <line x1="676" y1="606" x2="749" y2="630" stroke="#C25D07" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#dep-arrow)"/>
  <text x="710" y="640" text-anchor="middle" font-size="11" font-style="italic" fill="#8A4204">«include»</text>
</svg>
