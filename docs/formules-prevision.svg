<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675"
     font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"
           aria-label="Les cinq étapes du calcul de prévision : moyenne de chaque mois égale le total de ce mois sur toutes les années divisé par le nombre d'années ; total d'une année égale la somme de ses douze mois ; la pente est la progression moyenne du total par an, obtenue par régression linéaire ; le total prévu égale le dernier total connu plus la pente ; la prévision de chaque mois égale la moyenne du mois multipliée par le total prévu divisé par la somme des moyennes.">
        <rect x="0" y="0" width="900" height="675" fill="#FFFFFF"/>

        <!-- rail -->
        <line x1="46" y1="71"  x2="46" y2="177" stroke="#D6DCE1" stroke-width="2"/>
        <line x1="46" y1="211" x2="46" y2="287" stroke="#D6DCE1" stroke-width="2"/>
        <line x1="46" y1="321" x2="46" y2="417" stroke="#D6DCE1" stroke-width="2"/>
        <line x1="46" y1="451" x2="46" y2="527" stroke="#D6DCE1" stroke-width="2"/>

        <!-- ══ ÉTAPE 1 ══ -->
        <rect x="80" y="20" width="790" height="120" rx="9" fill="#FFFFFF" stroke="#D6DCE1" stroke-width="1.4"/>
        <circle cx="46" cy="54" r="17" fill="#C25D07"/>
        <text x="46" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
        <text x="110" y="52" font-size="15" font-weight="600" fill="#1B2127">Moyenne de chaque mois</text>

        <text x="360" y="106" text-anchor="end" font-size="15" fill="#1B2127">Moyenne du mois   =</text>
        <text x="545" y="90" text-anchor="middle" font-size="15" fill="#1B2127">total de ce mois sur toutes les années</text>
        <line x1="375" y1="100" x2="715" y2="100" stroke="#1B2127" stroke-width="1.4"/>
        <text x="545" y="122" text-anchor="middle" font-size="15" fill="#1B2127">nombre d'années disponibles</text>

        <!-- ══ ÉTAPE 2 ══ -->
        <rect x="80" y="160" width="790" height="90" rx="9" fill="#FFFFFF" stroke="#D6DCE1" stroke-width="1.4"/>
        <circle cx="46" cy="194" r="17" fill="#C25D07"/>
        <text x="46" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
        <text x="110" y="192" font-size="15" font-weight="600" fill="#1B2127">Total de chaque année</text>

        <text x="475" y="230" text-anchor="middle" font-size="15" fill="#1B2127">Total d'une année   =   somme de ses 12 mois</text>

        <!-- ══ ÉTAPE 3 ══ -->
        <rect x="80" y="270" width="790" height="110" rx="9" fill="#FFFFFF" stroke="#D6DCE1" stroke-width="1.4"/>
        <circle cx="46" cy="304" r="17" fill="#C25D07"/>
        <text x="46" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
        <text x="110" y="302" font-size="15" font-weight="600" fill="#1B2127">Pente de tendance</text>

        <text x="475" y="338" text-anchor="middle" font-size="15" fill="#1B2127">Pente   =   progression moyenne du total, par an</text>
        <text x="475" y="362" text-anchor="middle" font-size="12.5" fill="#75818B">obtenue par régression linéaire sur les totaux annuels</text>

        <!-- ══ ÉTAPE 4 ══ -->
        <rect x="80" y="400" width="790" height="90" rx="9" fill="#FFFFFF" stroke="#D6DCE1" stroke-width="1.4"/>
        <circle cx="46" cy="434" r="17" fill="#C25D07"/>
        <text x="46" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
        <text x="110" y="432" font-size="15" font-weight="600" fill="#1B2127">Total prévu pour l'année suivante</text>

        <text x="475" y="470" text-anchor="middle" font-size="15" fill="#1B2127">Total prévu   =   dernier total connu   +   pente</text>

        <!-- ══ ÉTAPE 5 ══ -->
        <rect x="80" y="510" width="790" height="140" rx="9" fill="#FFFDF9" stroke="#C25D07" stroke-width="1.8"/>
        <circle cx="46" cy="544" r="17" fill="#C25D07"/>
        <text x="46" y="550" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
        <text x="110" y="542" font-size="15" font-weight="600" fill="#1B2127">Prévision de chaque mois</text>

        <text x="527" y="598" text-anchor="end" font-size="15" fill="#1B2127">Prévision du mois   =   moyenne du mois   ×</text>
        <text x="650" y="582" text-anchor="middle" font-size="15" fill="#1B2127">total prévu</text>
        <line x1="562" y1="592" x2="738" y2="592" stroke="#1B2127" stroke-width="1.4"/>
        <text x="650" y="614" text-anchor="middle" font-size="15" fill="#1B2127">somme des moyennes</text>

        <text x="110" y="638" font-size="12.5" fill="#75818B">On obtient 12 valeurs, dont la somme est égale au total prévu.</text>
      </svg>
